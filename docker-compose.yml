services:
  postgres:
    image: postgres:16-alpine
    container_name: securetenant-postgres
    environment:
      POSTGRES_DB: securetenant
      POSTGRES_USER: securetenant
      POSTGRES_PASSWORD: securetenant
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securetenant -d securetenant"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: securetenant-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: true
      KC_HOSTNAME_STRICT: false
      KC_HEALTH_ENABLED: true
      KC_HTTP_PORT: 8080
    ports:
      - "8081:8080"
      - "9000:9000"
    volumes:
      - ./docker/keycloak/import:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /realms/securetenant HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && timeout 2 cat <&3 | grep -q 'securetenant'",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  kafka:
    image: apache/kafka:3.9.1
    container_name: securetenant-kafka
    ports:
      - "19092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: securetenant-kafka-cluster

  api:
    build: .
    container_name: securetenant-api
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DATABASE_URL: jdbc:postgresql://postgres:5432/securetenant
      DATABASE_USERNAME: securetenant
      DATABASE_PASSWORD: securetenant
      OAUTH2_ISSUER_URI: http://keycloak:8080/realms/securetenant
      OAUTH2_AUDIENCE: securetenant-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      OTEL_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_MESSAGING_KAFKA_ENABLED: "true"
      APP_PAYMENTS_OUTBOX_ENABLED: "true"
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:v3.4.0
    container_name: securetenant-prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.0.0
    container_name: securetenant-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "3000:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  otel-lgtm:
    image: grafana/otel-lgtm:latest
    container_name: securetenant-otel-lgtm
    ports:
      - "4317:4317"
      - "4318:4318"
      - "3001:3000"

volumes:
  postgres-data:
