global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: securetenant-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8080"]
  - job_name: securetenant-api-local
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
