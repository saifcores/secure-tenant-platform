spring:
  application:
    name: securetenant-api
  docker:
    compose:
      enabled: false
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/securetenant}
    username: ${DATABASE_USERNAME:securetenant}
    password: ${DATABASE_PASSWORD:securetenant}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8081/realms/securetenant}
          audiences: ${OAUTH2_AUDIENCE:securetenant-api}

  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: securetenant-api
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      auto-startup: false

server:
  port: ${SERVER_PORT:8080}
  

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,tenants
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  observations:
    key-values:
      application: ${spring.application.name}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  health:
    kafka:
      enabled: false

logging:
  structured:
    format:
      console: logstash
  level:
    root: INFO
    com.example.securetenant: INFO
    org.springframework.security: INFO

arconia:
  multitenancy:
    resolution:
      http:
        resolution-mode: oauth2
        oauth2:
          claim-name: tenant_id
        filter:
          additional-ignore-paths:
            - /api/tenants/**
            - /api/platform/**
    observations:
      cardinality: low
      key-name: tenant.id
    logging:
      mdc:
        enabled: true
        key-name: tenantId
  otel:
    enabled: ${OTEL_ENABLED:true}
    exporter:
      type: ${OTEL_EXPORTER_TYPE:otlp}
      otlp:
        endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
        protocol: http-protobuf

app:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    jwt:
      audience: ${OAUTH2_AUDIENCE:securetenant-api}
  messaging:
    kafka:
      enabled: ${APP_MESSAGING_KAFKA_ENABLED:false}
      topic: ${APP_MESSAGING_KAFKA_TOPIC:payments.events}
  payments:
    psp:
      timeout: ${APP_PAYMENTS_PSP_TIMEOUT:2s}
      max-attempts: ${APP_PAYMENTS_PSP_MAX_ATTEMPTS:3}
    retry:
      enabled: ${APP_PAYMENTS_RETRY_ENABLED:true}
      delay: ${APP_PAYMENTS_RETRY_DELAY:10s}
      interval: ${APP_PAYMENTS_RETRY_INTERVAL:15s}
    outbox:
      enabled: ${APP_PAYMENTS_OUTBOX_ENABLED:false}
      poll-interval: ${APP_PAYMENTS_OUTBOX_POLL_INTERVAL:5s}
      batch-size: 50
    reconciliation:
      enabled: ${APP_PAYMENTS_RECONCILIATION_ENABLED:true}
      interval: ${APP_PAYMENTS_RECONCILIATION_INTERVAL:60s}
